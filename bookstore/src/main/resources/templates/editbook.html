<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booklist</title>
</head>
<body>
  <h1>Edit book</h1>
	<div>
		<form th:object="${book}" th:action="@{/save}" action="#" method="post">
		  
      <!--Lähettää kirjan ID:n käyttäjältä piilossa-->
      <input type="hidden" th:field="*{id}" />

      <label for="title">Title</label>
      <input type="text" id="title" th:field="*{title}" />
			<div style="clear: both; display: block; height: 10px;"></div>

		  <label for="title">Author</label>
      <input type="text" id="author" th:field="*{author}" />
			<div style="clear: both; display: block; height: 10px;"></div>

		  <label for="title">Publication Year</label>
      <input type="text" id="publicationYear" th:field="*{publicationYear}" />
			<div style="clear: both; display: block; height: 10px;"></div>

      <label for="title">ISBN</label>
      <input type="text" id="isbn" th:field="*{isbn}" />
			<div style="clear: both; display: block; height: 10px;"></div>

      <label for="title">Price</label>
      <input type="text" id="price" th:field="*{price}" />
			<div style="clear: both; display: block; height: 10px;"></div>
      
			<input type="submit" value="Save"></input>
		</form>
	</div>
</body>
</html>
